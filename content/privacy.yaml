title: Privacyverklaring
intro: Hoe deze website met je persoonsgegevens omgaat.
draft: true
sections:
  - title: Wie is verantwoordelijk
    text: >-
      Wouter Coaching, gevestigd in Nijmegen, is verantwoordelijk voor de
      verwerking van persoonsgegevens zoals beschreven in deze verklaring. Je
      kunt contact opnemen via [e-mailadres volgt].
  - title: Welke gegevens worden verwerkt
    text: >-
      Als je het formulier voor een kennismaking invult, worden je naam,
      e-mailadres, eventueel je mobiele nummer en je bericht verwerkt. Vertel
      in je bericht alleen wat je zelf wilt delen.
  - title: Waarvoor en op welke grond
    text: >-
      De gegevens worden alleen gebruikt om contact met je op te nemen en een
      kennismaking te plannen. De grondslag is je eigen verzoek om contact.
  - title: Hoe lang worden gegevens bewaard
    text: >-
      Aanvragen die niet tot een traject leiden, worden na [termijn, aan te
      vullen] verwijderd. Voor cliënten gelden aparte afspraken die je bij de
      start van een traject ontvangt.
  - title: Delen met anderen
    text: >-
      Je gegevens worden niet verkocht en alleen gedeeld met partijen die nodig
      zijn om de website en e-mail te laten werken, zoals de hostingpartij.
      [Verwerkers aan te vullen bij livegang.]
  - title: Cookies
    text: >-
      Deze website plaatst geen tracking- of marketingcookies. Als dat
      verandert, wordt deze verklaring aangepast en wordt waar nodig vooraf om
      toestemming gevraagd.
  - title: Je rechten
    text: >-
      Je hebt het recht om je gegevens in te zien, te laten corrigeren of te
      laten verwijderen. Stuur daarvoor een bericht naar [e-mailadres volgt].
      Je kunt ook een klacht indienen bij de Autoriteit Persoonsgegevens.
