title: Voorbeeldcasus
kind: voorbeeld
theme: Thema
summary: >-
  Hier komt de korte samenvatting van een casus: het patroon in twee of drie
  zinnen, zodat een bezoeker direct ziet of het over iets herkenbaars gaat.
situation: >-
  Hier beschrijft Wouter wie er kwam (alleen rol en levensfase) en met welke
  vraag. Zonder herkenbare details.
signals: >-
  Hier staat wat het lichaam en het gedrag lieten zien: de signalen die
  opvielen, zonder medische dossiergegevens.
reading: >-
  Dit is de kern van de casus. Hier legt Wouter uit hoe hij de signalen met
  elkaar in verband bracht: lichaam, emotie, denken en gedrag.
audioTitle: Hier komt de titel van de gesproken toelichting (1:30)
audioTranscript: >-
  Hier komt de uitgeschreven tekst van de gesproken toelichting, voor wie niet
  kan of wil luisteren.
actions: >-
  Hier staan de twee tot vier stappen die in het traject zijn gezet.
outcome: >-
  Hier staat wat er veranderde: concreet, bescheiden en met een eerlijke
  tijdlijn.
