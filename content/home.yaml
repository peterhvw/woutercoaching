heroTitle: Begrijp wat je lichaam je vertelt.
heroIntro: >-
  Je lichaam en je gedrag laten zien wat je nog niet onder woorden kunt brengen.
  Als lifecoach met een achtergrond als psychosomatisch therapeut help ik je die
  signalen te begrijpen, zodat je keuzes maakt die bij je passen.
heroNote: Lifecoaching in Nijmegen en online
recogniseTitle: Herken je dit?
recogniseItems:
  - Je staat altijd 'aan' en komt ook in rustige periodes niet echt tot herstel.
  - >-
    Je hebt spanning, pijn of vermoeidheid waar geen duidelijke oorzaak voor
    wordt gevonden.
  - Je weet wat je niet meer wilt, maar niet wat je wel wilt.
  - Je zegt ja terwijl je lichaam al nee aangeeft.
  - >-
    Je loopt steeds tegen hetzelfde patroon aan, in je werk of in je relaties.
recogniseClosing: >-
  Dit zijn geen losse problemen. Het zijn signalen die samen iets vertellen over
  wat je nodig hebt en waar je grenzen liggen.
outcomesTitle: Wat coaching je oplevert
outcomes:
  - title: Je begrijpt je eigen signalen
    text: >-
      Je leert herkennen wat je lichaam, je emoties en je gedrag aangeven,
      bewust en onbewust.
  - title: Je maakt keuzes die kloppen
    text: >-
      Je weet wat je wilt, wat je nodig hebt en waar je grens ligt, en je
      handelt daarnaar.
  - title: Je houdt het vol
    text: >-
      Je gewoonten sluiten aan op wat je aankunt, ook in drukke periodes. Je
      herstelt sneller en ziet eerder aankomen wanneer het te veel wordt.
approachTitle: Lichaam en geest als één geheel
approachText: |-
  Stress, vermoeidheid en twijfel staan zelden los van elkaar. Daarom kijk ik niet alleen naar wat je denkt en vertelt, maar ook naar wat je lichaam laat zien: je houding, je spanning, je energie en je gezondheid.

  Ik combineer inzichten en methoden uit de psychologie en de gezondheidswetenschappen. Zo wordt duidelijk hoe je lichaamssignalen, emoties, gedachten en gedrag in contact met anderen met elkaar samenhangen.
aboutTitle: Over Wouter
aboutText: |-
  Ik ben Wouter, lifecoach en psychosomatisch therapeut. In mijn werk heb ik gezien hoeveel mensen hun eigen signalen pas opmerken als hun lichaam ze dwingt om te stoppen.

  Met mijn kennis van lichaam en psyche help ik je die signalen eerder te zien en te begrijpen.
faqTitle: Veelgestelde vragen
faq:
  - question: Wat is het verschil tussen coaching en therapie?
    answer: >-
      Coaching richt zich op inzicht, keuzes en gedrag in je dagelijks leven.
      Het is geen behandeling van een medische of psychische aandoening. Blijkt
      dat behandeling beter bij je vraag past, dan bespreek ik dat met je en
      denk ik mee over een verwijzing.
  - question: Hoe verloopt de kennismaking?
    answer: >-
      We spreken elkaar ongeveer een half uur, online of in Nijmegen. Jij
      vertelt waar je tegenaan loopt, ik leg uit hoe ik werk, en we bepalen
      samen of het past. De kennismaking is gratis en je zit nergens aan vast.
  - question: Hoeveel sessies heb ik nodig?
    answer: >-
      Dat hangt af van je vraag. Na de kennismaking krijg je een voorstel met
      het aantal sessies dat ik verwacht, zodat je vooraf weet waar je aan
      begint.
  - question: Kan coaching ook online?
    answer: >-
      Ja. Sessies kunnen in Nijmegen of via een videogesprek, en je kunt ze ook
      afwisselen.
  - question: Wat kost een traject?
    answer: >-
      De tarieven staan op de pagina Werkwijze. De kennismaking is altijd
      gratis.
ctaTitle: Benieuwd wat coaching voor jou kan doen?
ctaText: >-
  Plan een gratis kennismaking. We bespreken je vraag en je hoort eerlijk of ik
  de juiste persoon ben om je te helpen.
