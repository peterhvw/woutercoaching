title: Over mij
intro: >-
  Ik ben Wouter, lifecoach en psychosomatisch therapeut in Nijmegen. Ik help
  mensen begrijpen wat hun lichaam, emoties en gedrag hun vertellen.
story: >-
  [Concept, aan te vullen door Wouter: waarom ben je dit werk gaan doen?
  Beschrijf in een paar zinnen het moment of de ervaring die de aanleiding was.]


  Als psychosomatisch therapeut werk ik met mensen bij wie lichaam en psyche
  elkaar beïnvloeden. Daarin zie ik steeds hetzelfde: het lichaam geeft al lang
  signalen voordat iemand zelf doorheeft dat er iets moet veranderen.


  Die ervaring neem ik mee in mijn coaching. Ik kijk naar wat je vertelt, maar
  ook naar je lichaamstaal, je gezondheid, je emoties, je manier van denken en
  hoe je met anderen omgaat. Samen maken we daar een helder beeld van: wat wil
  je, wat heb je nodig, waar ligt je grens en welke gewoonten helpen of hinderen
  je.
credentialsTitle: Achtergrond
credentials:
  - '[Opleiding en diploma, aan te vullen]'
  - '[Aantal jaren ervaring als psychosomatisch therapeut, aan te vullen]'
  - '[Beroepsvereniging of register, aan te vullen]'
visionTitle: Hoe ik naar coaching kijk
vision: >-
  Ik werk met actuele wetenschappelijke inzichten en methoden uit de psychologie
  en de gezondheidswetenschappen. Die twee vakgebieden horen voor mij bij
  elkaar, omdat klachten en keuzes zelden alleen in het hoofd of alleen in het
  lichaam zitten.


  Je krijgt van mij geen kant-en-klare oplossing. Je leert je eigen signalen
  lezen, zodat je ook na het traject zelf verder kunt.
