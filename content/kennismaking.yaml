title: Plan een gratis kennismaking
intro: >-
  Vertel kort waar je tegenaan loopt. Ik neem contact met je op om een moment
  te plannen. De kennismaking is gratis en je zit nergens aan vast.
expectTitle: Wat je kunt verwachten
expectItems:
  - Een gesprek van ongeveer een half uur, online of in Nijmegen.
  - Je vertelt je verhaal en ik leg uit hoe ik werk.
  - Je hoort eerlijk of ik denk dat ik je kan helpen.
  - Je beslist daarna zelf of je verder wilt.
successTitle: Bedankt voor je bericht
successText: >-
  Je aanvraag is ontvangen. Ik neem contact met je op om een moment voor de
  kennismaking te plannen.
