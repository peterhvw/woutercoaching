title: Plan een gratis kennismaking
intro: >-
  Vertel kort waar je tegenaan loopt. Ik neem per e-mail of WhatsApp contact met je op om
  een moment te plannen. De kennismaking is gratis en je zit nergens aan vast.
expectTitle: Wat je kunt verwachten
expectItems:
  - Een gesprek van ongeveer een half uur, online of in Nijmegen.
  - Je vertelt je verhaal en ik leg uit hoe ik werk.
  - Je hoort eerlijk of ik denk dat ik je kan helpen.
  - Je beslist daarna zelf of je verder wilt.
nameLabel: Naam
emailLabel: E-mailadres
phoneLabel: Mobiel nummer voor WhatsApp
optionalLabel: optioneel
messageLabel: Waar loop je tegenaan?
submitLabel: Verstuur aanvraag
