title: Werkwijze
intro: >-
  Een traject bestaat uit vier stappen. Je weet vooraf wat je kunt verwachten en
  je beslist na elke stap zelf of je verdergaat.
steps:
  - title: Gratis kennismaking
    text: >-
      We spreken elkaar een half uur, online of in Nijmegen. Je vertelt waar je
      tegenaan loopt en ik leg uit hoe ik werk. Daarna bepalen we allebei of het
      past.
  - title: Intake
    text: >-
      We brengen in kaart wat er speelt: je vraag, je klachten en gewoonten, wat
      je lichaam aangeeft en wat je wilt bereiken. Je krijgt een voorstel voor
      het traject.
  - title: Sessies
    text: >-
      In de sessies onderzoeken we je patronen en oefen je met ander gedrag.
      Tussen de sessies pas je het toe in je dagelijks leven, zodat je merkt wat
      voor jou werkt.
  - title: Afronding
    text: >-
      We kijken wat je hebt bereikt en hoe je dat vasthoudt. Je weet welke
      signalen je serieus neemt en wat je dan doet.
practicalTitle: Praktisch
practical:
  - title: Waar
    text: In Nijmegen of online via een videogesprek. Afwisselen kan ook.
  - title: Duur van een sessie
    text: '[Aan te vullen, bijvoorbeeld 60 of 90 minuten]'
  - title: Aantal sessies
    text: '[Aan te vullen, bijvoorbeeld gemiddeld 5 tot 7 sessies]'
priceTitle: Tarieven
priceText: |-
  De kennismaking is gratis. Na de intake krijg je een voorstel met het aantal sessies en de totale kosten, zodat je vooraf weet waar je aan toe bent.

  Bedragen voor particulieren zijn inclusief btw.
boundaryTitle: Coaching en therapie
boundaryText: |-
  Coaching is geen behandeling van een medische of psychische aandoening en vervangt geen huisarts, psycholoog of medisch specialist. Blijkt tijdens de kennismaking of het traject dat behandeling beter bij je vraag past, dan bespreek ik dat met je en denk ik mee over een verwijzing.
